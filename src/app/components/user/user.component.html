@if (users.length == 0) {
  <div class="alert alert-danger mt-2">
    <p>No hay registro de usuarios en el sistema.</p>
  </div>
} @else {
  <div class="table-responsive">
    <table class="table table-striped table-hover border caption-top">
      <caption class="bg-secondary text-center text-uppercase text-white">
        Lista de usuarios registrados este mes.
      </caption>
      <thead class="table-dark">
        <tr>
          <!-- <th scope="col">Id</th> -->
          <th scope="col">Nombre</th>
          <th scope="col">Apellido</th>
          <th scope="col">Email</th>
          <th scope="col">Usuario</th>
          <th scope="col">Eliminar</th>
          <th scope="col">Editar</th>
        </tr>
      </thead>
      <tbody>
        @for (u of users; track $index) {
          <tr>
            <!-- <td>{{ u.id }}</td> -->
            <td>{{ u.name }}</td>
            <td>{{ u.lastName }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.username }}</td>
            <td>
              <button
                class="btn btn-warning pointer btn-sm"
                (click)="onRemoveUser(u.id)"
              >
                Eliminar
              </button>
            </td>
            <td>
              <button
                class="btn btn-info pointer btn-sm"
                (click)="onChangeUser(u)"
              >
                Editar
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
